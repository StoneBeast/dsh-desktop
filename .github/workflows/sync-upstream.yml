name: Sync upstream

# Merges anywhere-labs/dsh-desktop's master into this fork's master.
#
# The fork is always diverged (it carries the PR #946 patch commit), so GitHub's
# built-in "Sync fork" fast-forward cannot be used -- this runs a real merge.
#
# A plain `git merge` is not enough: the fork's patch resolution and update-feed
# URLs sit on lines upstream rewrites on every release, so the merge conflicts
# every time. `fork/sync-upstream.mjs` resolves only conflicts it can prove are
# fork-owned, re-ports the vendored patch to the new runtime version, and aborts
# without pushing when anything falls outside that. The gates below then confirm
# the opencode-go header is still accounted for before master moves.

on:
  schedule:
    # Daily at 03:00 UTC (11:00 Asia/Shanghai). Remove this to sync by hand only.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      probe_token:
        description: Also prove the token can write .github/workflows (throwaway branch, deleted right after)
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          # GITHUB_TOKEN cannot push changes to .github/workflows/*, so a merge
          # that touches upstream's ci.yml is rejected without a token carrying
          # the `workflows` scope. See fork/README.md.
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Report the push credential
        env:
          HAS_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [[ "$HAS_SYNC_TOKEN" == "true" ]]; then
            echo "Pushing with \`UPSTREAM_SYNC_TOKEN\` (a sync that touches \`.github/workflows/\` can push)." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### \`UPSTREAM_SYNC_TOKEN\` is not visible to this job"
              echo
              echo 'Falling back to `GITHUB_TOKEN`, which cannot push `.github/workflows/*`.'
              echo 'Check the secret is named exactly `UPSTREAM_SYNC_TOKEN`, and is a'
              echo '**repository** secret under *Secrets and variables → Actions* (not a'
              echo 'variable, and not under *Environments*).'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::UPSTREAM_SYNC_TOKEN is not set; workflow-touching syncs will be rejected"
          fi
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

      - name: Merge upstream and re-wire the fork patch
        id: sync
        run: |
          set -euo pipefail
          node fork/sync-upstream.mjs --repo "$GITHUB_REPOSITORY" | tee sync.log
          if grep -qx 'changed=true' sync.log; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate the lockfile
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # A re-ported patch changes a patch: resolution, and those carry a
          # Yarn-computed hash that cannot be written by hand.
          corepack yarn install
          if git diff --quiet -- yarn.lock; then
            echo "yarn.lock already matches package.json"
            exit 0
          fi
          git add yarn.lock
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: regenerate yarn.lock after the upstream sync'

      - name: Verify the opencode-go header is still accounted for
        if: steps.sync.outputs.changed == 'true'
        id: guard
        continue-on-error: true
        run: |
          set -euo pipefail
          node fork/verify-patch-retained.mjs
          node scripts/sync-vendored-runtime.mjs --check --channel stable
          node scripts/sync-vendored-runtime.mjs --check --channel beta
          corepack yarn install --immutable

      - name: Explain a failed guard
        if: steps.sync.outputs.changed == 'true' && steps.guard.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### The upstream merge is valid but the fork patch is not

          Nothing was pushed, so `master` still builds. Re-port the patch:

          1. `git fetch upstream && git merge upstream/master`
          2. `node fork/sync-upstream.mjs --repo <owner>/<name>` — it re-ports the patch
             automatically when the anchors survived, and says so when they did not.
          3. `corepack yarn install` to rewrite the `patch:` resolutions and `yarn.lock`.
          4. Push, then re-run this workflow.
          EOF
          body="$(printf 'The upstream sync merged cleanly but the fork patch failed its guard, so nothing was pushed.\n\nSee the [Actions run](%s/%s/actions/runs/%s).\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          gh issue create --title 'Upstream sync blocked: re-port the opencode-go patch' --body "$body" \
            || echo "::warning::could not open a tracking issue"
          exit 1

      - name: Push
        if: steps.sync.outputs.changed == 'true' && steps.guard.outcome == 'success'
        run: |
          set -euo pipefail
          if git push origin HEAD:master 2>push-error.txt; then
            echo "Merged upstream into master." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat push-error.txt
          if grep -qi 'workflow' push-error.txt; then
            cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
            ### Push rejected: `.github/workflows/*` needs a token with the `workflows` scope

            The default `GITHUB_TOKEN` cannot create or update workflow files, and this
            merge touched them. Nothing was pushed.

            Fix: add a repository secret named `UPSTREAM_SYNC_TOKEN` holding a
            fine-grained PAT with **Contents: write** and **Workflows: write**, then
            re-run this workflow.
            EOF
          else
            cat push-error.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1

  # Opt-in diagnostic. Nothing else can reveal whether the token really carries
  # the `workflows` scope: a secret's value is unreadable, and a fine-grained PAT
  # does not advertise its scopes. This pushes one throwaway workflow file to a
  # scratch branch and deletes the branch immediately. It cannot auto-run, and it
  # never touches master.
  probe:
    if: github.event_name == 'workflow_dispatch' && inputs.probe_token
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 1
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
      - name: Prove the token can write .github/workflows
        env:
          # Passed through the environment, never spliced into the script text.
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SYNC_TOKEN:-}" ]]; then
            echo "::error::UPSTREAM_SYNC_TOKEN is empty, so this run would only test GITHUB_TOKEN"
            exit 1
          fi
          branch="probe/workflow-write-${GITHUB_RUN_ID}"
          printf 'name: token probe\non:\n  workflow_dispatch:\n\njobs:\n  noop:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo probe\n' \
            > .github/workflows/zz-token-probe.yml
          git checkout -b "$branch"
          git add -f .github/workflows/zz-token-probe.yml
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'probe: workflow write permission'
          if ! git push origin "$branch" 2>probe-error.txt; then
            cat probe-error.txt
            {
              echo '### The token cannot write `.github/workflows`'
              echo
              echo 'Add **Workflows: Read and write** to the fine-grained PAT, update the'
              echo '`UPSTREAM_SYNC_TOKEN` secret with the new token, and re-run this probe.'
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi
          git push origin --delete "$branch"
          {
            echo '### Token OK'
            echo 'The token can write `.github/workflows`, so syncs that touch upstream CI will push.'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
